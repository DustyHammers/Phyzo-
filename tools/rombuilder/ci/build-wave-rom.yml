# Example workflow for the PRIVATE data repo (not the public code repo).
# Checks out the public code at a pinned ref, builds the tools, builds the ROM from the private inputs,
# renders C4 + sweeps, runs the regression and uploads the ROM as a private artifact.
name: build-wave-rom
on: [workflow_dispatch, push]
jobs:
  rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # private data repo
      - uses: actions/checkout@v4
        with: { repository: YOUR_ORG/YOUR_PUBLIC_REPO, path: code, ref: main }
      - run: sudo apt-get update && sudo apt-get install -y cmake python3-numpy
      - run: cmake -S code/tools/rombuilder -B build && cmake --build build -j
      - run: |
          mkdir -p out/report out/renders
          ./build/rombuilder --manifest phyzo_wave_manifest.csv --sources rom_sources.csv --data-root WAVE_SOURCES \
            --exp3-text "EXP3 Transwaves.txt" --out out/phyzo_wave_rom.bin --report-dir out/report --rom-version 0.1
          ./build/refplayer out/phyzo_wave_rom.bin out/renders
          python3 code/tools/rombuilder/regress/regress.py out/phyzo_wave_rom.bin out/renders regress_targets.csv out/report
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: wave-rom, path: out/ }
